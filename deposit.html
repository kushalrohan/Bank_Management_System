{% extends "base.html" %}
{% block content %}
<h2>Deposit Money</h2>
<div class="card">
    <form method="POST">
        <label>Account Number <input type="text" name="account_number" required></label>
        <label>Amount <input type="number" step="0.01" min="0.01" name="amount" required></label>
        <button type="submit" class="btn-primary">Deposit</button>
    </form>
</div>
{% endblock %}
