{% extends "base.html" %}
{% block content %}
<h2>Money Transfer</h2>
<div class="card">
    <form method="POST">
        <label>From Account <input type="text" name="from_account" required></label>
        <label>To Account <input type="text" name="to_account" required></label>
        <label>Amount <input type="number" step="0.01" min="0.01" name="amount" required></label>
        <button type="submit" class="btn-primary">Transfer</button>
    </form>
</div>
{% endblock %}
